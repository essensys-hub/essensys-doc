<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="pe-title pe-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="pe-title">Par où la surtension a-t-elle pu entrer ?</title>
  <desc id="pe-desc">Plan simplifié de la maison : le réseau électrique arrive au tableau, qui alimente les sorties 230 V des boîtiers auxiliaires ; l'installation photovoltaïque (panneaux, onduleur hybride, coffret photovoltaïque) est voisine du coffret domotique ; le dongle de supervision de l'onduleur et le boîtier principal sont branchés sur le même switch réseau ; les boîtiers auxiliaires sont reliés aux boutons des pièces et à des départs 230 V extérieurs. Quatre portes d'entrée possibles sont numérotées : réseau électrique, installation photovoltaïque, câble Ethernet via le switch, câblage des boutons et des sorties 230 V. Ce sont des hypothèses à départager, aucune n'est établie. D'autres pistes restent également ouvertes : surtension temporaire du réseau, défaut de l'onduleur ou du parafoudre AC, indices sans lien avec la panne.</desc>
  <defs>
    <path id="pe-bolt" d="M14 0 L34 0 L24 24 L38 24 L8 66 L16 34 L2 34 Z"/>
  </defs>
  <style>
    .pe-h1{font-size:26px;font-weight:700;fill:#0F172A}
    .pe-sub{font-size:15px;fill:#475569}
    .pe-box{font-size:13px;font-weight:700;fill:#0F172A}
    .pe-txt{font-size:13px;fill:#334155}
    .pe-sm{font-size:12px;fill:#475569}
    .pe-card{font-size:13px;fill:#334155}
    .pe-ct{font-size:15px;font-weight:700;fill:#0F172A}
    .pe-chk{font-size:12.5px;fill:#475569;font-style:italic}
    .pe-b{font-weight:700}
    .pe-pill{font-size:11px;font-weight:700;letter-spacing:.06em}
    .pe-door{font-size:14px;font-weight:700;fill:#FFFFFF}
  </style>

  <rect x="1" y="1" width="898" height="898" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="40" y="48" class="pe-h1">Par où la surtension a-t-elle pu entrer ?</text>
  <text x="40" y="76" class="pe-sub">Quatre portes d'entrée possibles vers les îlots du coffret domotique.</text>
  <rect x="604" y="58" width="256" height="26" rx="13" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="732" y="76" text-anchor="middle" class="pe-pill" fill="#92400E" font-size="12">HYPOTHÈSES À DÉPARTAGER</text>

  <!-- ===================== Maison ===================== -->
  <path d="M120,190 L460,112 L800,190 L800,470 L120,470 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="120" y1="190" x2="800" y2="190" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- foudre (lieu d'impact inconnu) -->
  <use xlink:href="#pe-bolt" transform="translate(48,96)" fill="#FBBF24" stroke="#B45309" stroke-width="2" stroke-linejoin="round"/>
  <text x="92" y="128" font-size="26" font-weight="700" fill="#B45309">?</text>
  <use xlink:href="#pe-bolt" transform="translate(818,96)" fill="#FBBF24" stroke="#B45309" stroke-width="2" stroke-linejoin="round"/>
  <text x="802" y="128" font-size="26" font-weight="700" fill="#B45309" text-anchor="end">?</text>

  <!-- réseau électrique (extérieur gauche) -->
  <g stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="72" y1="215" x2="72" y2="300"/>
    <line x1="56" y1="225" x2="88" y2="225"/>
    <line x1="60" y1="240" x2="84" y2="240"/>
  </g>
  <text x="40" y="320" class="pe-box">réseau</text>
  <text x="40" y="336" class="pe-box">électrique</text>
  <path d="M88,225 C110,228 125,245 145,250" fill="none" stroke="#C2410C" stroke-width="3"/>

  <!-- tableau électrique -->
  <rect x="145" y="210" width="140" height="135" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="215" y="232" text-anchor="middle" class="pe-box">tableau électrique</text>
  <rect x="163" y="248" width="104" height="58" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="215" y="267" text-anchor="middle" class="pe-sm">parafoudre</text>
  <text x="215" y="282" text-anchor="middle" class="pe-sm">de type 2</text>
  <circle cx="186" cy="295" r="5" fill="#16A34A"/>
  <text x="196" y="299" class="pe-sm" fill="#15803D">voyant vert</text>
  <text x="215" y="334" text-anchor="middle" class="pe-sm">disjoncteurs, départs</text>

  <!-- 230 V vers les BA -->
  <path d="M285,300 L330,300" stroke="#C2410C" stroke-width="3"/>
  <text x="287" y="282" class="pe-sm" fill="#9A3412">230 V</text>

  <!-- coffret domotique -->
  <rect x="330" y="205" width="180" height="240" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="420" y="226" text-anchor="middle" class="pe-box" fill="#1E3A8A">coffret domotique</text>
  <g stroke="#1D4ED8" stroke-width="1.5" fill="#DBEAFE">
    <rect x="360" y="240" width="135" height="34" rx="7"/>
    <rect x="360" y="284" width="135" height="34" rx="7"/>
    <rect x="360" y="328" width="135" height="34" rx="7"/>
    <rect x="360" y="372" width="135" height="34" rx="7"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">
    <text x="427" y="262">BA · SC940D</text>
    <text x="427" y="306">BA · SC941C</text>
    <text x="427" y="350">BA · SC942C</text>
    <text x="427" y="394">BP · SC944D</text>
  </g>
  <!-- bus -->
  <path d="M360,257 H346 V389 H360 M346,301 H360 M346,345 H360" fill="none" stroke="#6D28D9" stroke-width="3.5"/>
  <text x="420" y="432" text-anchor="middle" class="pe-sm">4 îlots flottants</text>

  <!-- photovoltaïque -->
  <g transform="translate(600,138)">
    <path d="M0,30 L60,14 L84,30 L24,46 Z" fill="#1E3A8A" stroke="#0F172A" stroke-width="1.5"/>
    <path d="M30,22 L54,38 M15,26 L39,42 M45,18 L69,34" stroke="#93C5FD" stroke-width="1"/>
  </g>
  <text x="694" y="164" class="pe-sm">panneaux</text>
  <path d="M640,180 L650,205 M655,177 L665,205" stroke="#B45309" stroke-width="2.5"/>
  <rect x="590" y="205" width="150" height="42" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/>
  <text x="665" y="231" text-anchor="middle" class="pe-box">onduleur hybride</text>
  <line x1="665" y1="247" x2="665" y2="262" stroke="#C2410C" stroke-width="3"/>
  <rect x="590" y="262" width="150" height="88" rx="8" fill="#FFF7ED" stroke="#B45309" stroke-width="2"/>
  <text x="665" y="282" text-anchor="middle" class="pe-box">coffret PV</text>
  <rect x="606" y="292" width="118" height="48" rx="6" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="665" y="310" text-anchor="middle" class="pe-sm">parafoudre AC</text>
  <rect x="628" y="318" width="12" height="12" rx="2" fill="#0F172A"/>
  <rect x="644" y="318" width="12" height="12" rx="2" fill="#0F172A"/>
  <text x="662" y="329" class="pe-sm" fill="#0F172A" font-weight="700">au noir</text>

  <!-- câbles PV qui longent le coffret domotique -->
  <path d="M590,220 L540,220 C525,220 518,212 510,212" fill="none" stroke="#B45309" stroke-width="3.5"/>
  <text x="522" y="201" class="pe-sm" fill="#92400E" font-weight="700">câbles PV</text>

  <!-- dongle + switch -->
  <path d="M740,226 H770 V396" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="690" y="396" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="740" y="413" text-anchor="middle" class="pe-sm" fill="#1E3A8A" font-weight="700">dongle de</text>
  <text x="740" y="428" text-anchor="middle" class="pe-sm" fill="#1E3A8A" font-weight="700">supervision</text>
  <text x="740" y="455" text-anchor="middle" class="pe-sm" fill="#B91C1C" font-weight="700">ne répond plus</text>
  <rect x="550" y="396" width="122" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="611" y="421" text-anchor="middle" class="pe-box" fill="#1E3A8A">switch réseau</text>
  <path d="M690,416 H672" stroke="#2563EB" stroke-width="2.5"/>
  <path d="M550,416 H528 V389 H495" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text x="566" y="390" class="pe-sm" fill="#1E40AF">Ethernet</text>

  <!-- boutons et départs extérieurs (nappes des BA) -->
  <path d="M395,205 V160" stroke="#64748B" stroke-width="2.5"/>
  <path d="M410,205 V160" stroke="#64748B" stroke-width="2.5"/>
  <text x="420" y="152" text-anchor="middle" class="pe-sm" fill="#334155" font-weight="700">vers les boutons des pièces</text>
  <path d="M330,425 H120" stroke="#C2410C" stroke-width="2.5"/>
  <path d="M120,425 H96" stroke="#C2410C" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="22" y="447" class="pe-sm" font-weight="700" fill="#9A3412">départs 230 V</text>
  <text x="22" y="462" class="pe-sm" font-weight="700" fill="#9A3412">vers l'extérieur</text>

  <!-- portes numérotées -->
  <g>
    <circle cx="307" cy="300" r="13" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/>
    <text x="307" y="305" text-anchor="middle" class="pe-door">1</text>
    <circle cx="552" cy="220" r="13" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/>
    <text x="552" y="225" text-anchor="middle" class="pe-door">2</text>
    <circle cx="528" cy="403" r="13" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/>
    <text x="528" y="408" text-anchor="middle" class="pe-door">3</text>
    <circle cx="402" cy="190" r="13" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/>
    <text x="402" y="195" text-anchor="middle" class="pe-door">4</text>
    <circle cx="225" cy="425" r="13" fill="#B45309" stroke="#FFFFFF" stroke-width="2"/>
    <text x="225" y="430" text-anchor="middle" class="pe-door">4</text>
  </g>

  <!-- ===================== Fiches des portes ===================== -->
  <!-- 1 -->
  <rect x="40" y="490" width="405" height="160" rx="12" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>
  <circle cx="64" cy="514" r="12" fill="#B45309"/><text x="64" y="519" text-anchor="middle" class="pe-door" font-size="13">1</text>
  <text x="84" y="519" class="pe-ct">Réseau électrique</text>
  <text x="58" y="544" class="pe-card">Le parafoudre du tableau est vert, mais sa partie</text>
  <text x="58" y="561" class="pe-card">neutre-terre n'a pas de voyant : il a pu travailler.</text>
  <text x="58" y="578" class="pe-card">Le choc doit ensuite franchir l'isolement entre le</text>
  <text x="58" y="595" class="pe-card">230 V et la très basse tension des BA, ou suivre</text>
  <text x="58" y="612" class="pe-card">les nappes qui longent le 230 V.</text>
  <text x="58" y="636" class="pe-chk">À vérifier : traces d'amorçage, essai d'isolement.</text>

  <!-- 2 -->
  <rect x="455" y="490" width="405" height="160" rx="12" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>
  <circle cx="479" cy="514" r="12" fill="#B45309"/><text x="479" y="519" text-anchor="middle" class="pe-door" font-size="13">2</text>
  <text x="499" y="519" class="pe-ct">Installation photovoltaïque</text>
  <text x="473" y="544" class="pe-card"><tspan class="pe-b" fill="#047857">Constaté :</tspan> parafoudre AC du coffret PV au noir,</text>
  <text x="473" y="561" class="pe-card">dongle de supervision de l'onduleur muet.</text>
  <text x="473" y="578" class="pe-card">Le choc peut rejoindre le BP par l'Ethernet (porte 3).</text>
  <text x="473" y="595" class="pe-card">Les câbles PV longent aussi le coffret, mais touchent</text>
  <text x="473" y="612" class="pe-card">plutôt le côté 230 V et les nappes que le bus.</text>
  <text x="473" y="636" class="pe-chk">À vérifier : journal de l'onduleur, notice du parafoudre.</text>

  <!-- 3 -->
  <rect x="40" y="660" width="405" height="160" rx="12" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>
  <circle cx="64" cy="684" r="12" fill="#B45309"/><text x="64" y="689" text-anchor="middle" class="pe-door" font-size="13">3</text>
  <text x="84" y="689" class="pe-ct">Câble Ethernet, via le switch</text>
  <text x="58" y="714" class="pe-card">Le dongle de l'onduleur et le BP partagent le switch,</text>
  <text x="58" y="731" class="pe-card">et le port Ethernet du BP est couplé à son 0 V.</text>
  <text x="58" y="748" class="pe-card">Mais sans amorçage, 0,3 à 1,7 A seulement passent</text>
  <text x="58" y="765" class="pe-card">(il en faut ≈ 11 à 20) : un amorçage laisse des traces.</text>
  <text x="58" y="782" class="pe-card">Un switch relié à la terre détournerait ce courant.</text>
  <text x="58" y="806" class="pe-chk">À vérifier : journaux du switch, port du BP à l'établi.</text>

  <!-- 4 -->
  <rect x="455" y="660" width="405" height="160" rx="12" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>
  <circle cx="479" cy="684" r="12" fill="#B45309"/><text x="479" y="689" text-anchor="middle" class="pe-door" font-size="13">4</text>
  <text x="499" y="689" class="pe-ct">Boutons et sorties 230 V</text>
  <text x="473" y="714" class="pe-card">Le 0 V de chaque BA s'étend jusqu'à ses boutons,</text>
  <text x="473" y="731" class="pe-card">et des sorties 230 V partent vers l'extérieur.</text>
  <text x="473" y="748" class="pe-card">Condition : la boucle doit se fermer à l'autre bout</text>
  <text x="473" y="765" class="pe-card">(amorçage, pièce métallique reliée à la terre…).</text>
  <text x="473" y="806" class="pe-chk">À vérifier : protections d'entrée, isolement.</text>

  <!-- ===================== Faits et autres pistes ===================== -->
  <rect x="40" y="834" width="84" height="20" rx="10" fill="#D1FAE5" stroke="#047857"/>
  <text x="82" y="848" text-anchor="middle" class="pe-pill" fill="#047857">CONSTATÉ</text>
  <text x="134" y="849" class="pe-txt">9 août 2026, fin d'après-midi : PV à 0 W (supervision) ; disjoncteur déclenché selon l'occupant.</text>
  <text x="40" y="878" class="pe-sm">Autres pistes (également ouvertes) : surtension temporaire du réseau, défaut de l'onduleur ou du parafoudre AC, indices sans lien avec la panne.</text>
</svg>
