dasharray="6 4"/><text x="720" y="218" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="600">Pièces d'eau</text><text x="720" y="234" text-anchor="middle" font-size="10" fill="#334155" font-weight="400">22 poussoirs · 13 écl. · 4 volets · 1 var.</text><line x1="620" y1="300" x2="820" y2="300" stroke="#0f766e" stroke-width="3"/><line x1="720" y1="184" x2="720" y2="300" stroke="#0f766e" stroke-width="2"/><rect x="615" y="245" width="100" height="40" rx="6" fill="#f3f6fa" stroke="#334155" stroke-width="1.5"/><text x="665.0" y="267" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Alimentation</text><text x="665.0" y="285" text-anchor="middle" font-size="11" fill="#334155">STC</text><rect x="725" y="245" width="100" height="40" rx="6" fill="#f3f6fa" stroke="#334155" stroke-width="1.5"/><text x="775.0" y="267" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Entrées</text><text x="775.0" y="285" text-anchor="middle" font-size="11" fill="#334155">BE-16 + BE-08</text><rect x="615" y="320" width="100" height="40" rx="6" fill="#f3f6fa" stroke="#334155" stroke-width="1.5"/><text x="665.0" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Actionneurs</text><text x="665.0" y="360" text-anchor="middle" font-size="11" fill="#334155">AKS</text><rect x="725" y="320" width="100" height="40" rx="6" fill="#f3f6fa" stroke="#334155" stroke-width="1.5"/><text x="775.0" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Volets</text><text x="775.0" y="360" text-anchor="middle" font-size="11" fill="#334155">JAL</text><rect x="670" y="375" width="100" height="40" rx="6" fill="#f3f6fa" stroke="#334155" stroke-width="1.5"/><text x="720.0" y="397" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Variateurs</text><text x="720.0" y="415" text-anchor="middle" font-size="11" fill="#334155">AKD</text><line x1="665" y1="285" x2="665" y2="300" stroke="#0f766e" stroke-width="2"/><line x1="665" y1="300" x2="665" y2="320" stroke="#0f766e" stroke-width="2"/><line x1="775" y1="285" x2="775" y2="300" stroke="#0f766e" stroke-width="2"/><line x1="775" y1="300" x2="775" y2="320" stroke="#0f766e" stroke-width="2"/><line x1="720" y1="300" x2="720" y2="375" stroke="#0f766e" stroke-width="2"/><text x="720" y="430" text-anchor="middle" font-size="10" fill="#b45309" font-weight="400">isolement galvanique au coupleur</text><text x="450" y="480" text-anchor="middle" font-size="11" fill="#334155" font-weight="400">Une alimentation par ligne. La perte d'une ligne de zone ne touche que sa zone ; la perte de la ligne principale laisse les trois zones commuter localement.</text><text x="450" y="500" text-anchor="middle" font-size="11" fill="#64748b" font-weight="400">Les 63 poussoirs arrivent aux entrées de leur zone ; les charges 230 V sortent des actionneurs de leur zone. Aucun câble KNX ne sort de l'armoire.</text></svg>