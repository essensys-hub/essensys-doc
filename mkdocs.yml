site_name: Essensys Documentation
site_description: Documentation publique Essensys — architecture, installation, guides utilisateur
site_author: Essensys Team
site_url: https://www.essensys.fr/docs/

repo_name: essensys-hub/essensys-doc
repo_url: https://github.com/essensys-hub/essensys-doc
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - glightbox

nav:
  - Accueil: index.md
  - Installation:
    - install/index.md
    - Gateway CM5: install/gateway-cm5.md
    - HTTPS local: install/https-local.md
    - Raspberry Pi: install/raspberry-pi.md
    - Ajouter ou remplacer un BP: install/ajout-bp.md
    - Protection contre les surtensions: install/protection-surtensions.md
    - Remise en service après surtension: install/remise-en-service-surtension.md
    - Module N2 ESP32: install/module-n2-esp32.md
  - Architecture:
    - Vue d'ensemble: architecture/overview.md
    - Table d'echange: architecture/exchange-table.md
    - Domaines fonctionnels: architecture/domaines-fonctionnels.md
    - Pattern Bridge: architecture/bridge-pattern.md
    - Deploiement: architecture/deployment.md
    - Conteneurs: architecture/containers.md
    - Inscription Turnstile: architecture/turnstile-registration.md
    - Materiel: architecture/hardware-overview.md
    - Diagrammes: architecture/diagrams.md
    - Client legacy: architecture/legacy-client.md
  - Debug:
    - debug/index.md
    - Espion I2C passif: debug/espion-i2c.md
  - Retours d'expérience:
    - Présentation: retex/index.md
    - Foudre du 9 août 2026:
      - Synthèse: retex/foudre-2026/synthese.md
      - Analyse experte: retex/foudre-2026/analyse-experte.md
      - Contrôle du BP au multimètre: retex/foudre-2026/controle-bp-multimetre.md
  - Études:
    - Présentation: etudes/index.md
    - Répondre à l'exigence de résilience: etudes/resilience.md
    - Remplacement des cartes de l'armoire:
      - "V2 : filaire d'abord (recommandée)": etudes/remplacement-armoire/v2/filaire-d-abord.md
      - Conseil d'autocritique: etudes/remplacement-armoire/v2/conseil.md
      - Autocritique des études V1: etudes/remplacement-armoire/v2/autocritique-v1.md
      - Banc deux lumières: etudes/banc-deux-lumieres.md
      - Sections de câbles: etudes/remplacement-armoire/v2/sections-de-cables.md
      - "V1 figées (21 octobre 2026)":
        - Revolution Pi: etudes/remplacement-armoire/revolution-pi.md
        - Arduino Opta: etudes/remplacement-armoire/arduino-opta.md
        - Raspberry Pi et Ethernet: etudes/remplacement-armoire/raspberry-pi-ethernet.md

extra:
  generator: false
